<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" width="620" height="560" role="img" aria-hidden="true" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="h-folder-front" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#F79462"/><stop offset=".55" stop-color="#F16A36"/><stop offset="1" stop-color="#D9531F"/>
    </linearGradient>
    <linearGradient id="h-folder-mid" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#FBAE84"/><stop offset="1" stop-color="#EE7C46"/>
    </linearGradient>
    <linearGradient id="h-folder-back" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#FDC5A4"/><stop offset="1" stop-color="#F49468"/>
    </linearGradient>
    <linearGradient id="h-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEADC"/>
    </linearGradient>
    <linearGradient id="h-steel" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#EDF3F7"/><stop offset=".5" stop-color="#C6D4DF"/><stop offset="1" stop-color="#93A6B6"/>
    </linearGradient>
    <radialGradient id="h-glass" cx=".34" cy=".3" r=".78">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset=".45" stop-color="#9DEAF2" stop-opacity=".62"/>
      <stop offset="1" stop-color="#3FC3D4" stop-opacity=".78"/>
    </radialGradient>
    <linearGradient id="h-rim" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#8FE6F0"/><stop offset="1" stop-color="#2FA7BA"/>
    </linearGradient>
    <pattern id="h-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#31577C" stroke-width="1" opacity=".55"/>
    </pattern>
    <filter id="h-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10243A" flood-opacity=".18"/>
    </filter>
    <filter id="h-soft-sm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10243A" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Bang ghim nen toi, luoi rat nhat -->
  <g filter="url(#h-soft)">
    <rect x="236" y="14" width="372" height="300" rx="18" fill="#13293F"/>
    <rect x="236" y="14" width="372" height="300" rx="18" fill="url(#h-grid)"/>
  </g>

  <!-- Chi noi giua cac ghim -->
  <path d="M312 66 L470 52 L556 152" fill="none" stroke="#F16A36" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>

  <!-- The ghim 1: tin nhan -->
  <g transform="rotate(-6 312 124)" filter="url(#h-soft-sm)">
    <rect x="258" y="66" width="108" height="116" rx="8" fill="url(#h-paper)"/>
    <rect x="272" y="86" width="64" height="26" rx="9" fill="#2A4B68"/>
    <rect x="290" y="120" width="60" height="22" rx="8" fill="#B9C6D2"/>
    <rect x="272" y="150" width="48" height="18" rx="7" fill="#2A4B68" opacity=".55"/>
  </g>
  <circle cx="312" cy="66" r="7" fill="#E0453A"/><circle cx="310" cy="64" r="2.4" fill="#FFB0A8"/>

  <!-- The ghim 2: cua so trinh duyet -->
  <g transform="rotate(4 470 110)" filter="url(#h-soft-sm)">
    <rect x="396" y="52" width="148" height="112" rx="8" fill="url(#h-paper)"/>
    <path d="M396 60a8 8 0 0 1 8-8h132a8 8 0 0 1 8 8v14H396z" fill="#DFE5EA"/>
    <circle cx="410" cy="63" r="3.4" fill="#A9B6C2"/><circle cx="422" cy="63" r="3.4" fill="#A9B6C2"/><circle cx="434" cy="63" r="3.4" fill="#A9B6C2"/>
    <rect x="410" y="88" width="104" height="9" rx="4.5" fill="#2A4B68" opacity=".7"/>
    <rect x="410" y="104" width="76" height="9" rx="4.5" fill="#B9C6D2"/>
    <rect x="410" y="120" width="92" height="9" rx="4.5" fill="#B9C6D2"/>
    <path d="M496 118 l22 13 -9 2.5 -1.5 9.5 z" fill="#10243A"/>
  </g>
  <circle cx="470" cy="52" r="7" fill="#E0453A"/><circle cx="468" cy="50" r="2.4" fill="#FFB0A8"/>

  <!-- The ghim 3: ho so nguoi -->
  <g transform="rotate(8 556 206)" filter="url(#h-soft-sm)">
    <rect x="512" y="152" width="92" height="108" rx="8" fill="url(#h-paper)"/>
    <circle cx="558" cy="192" r="17" fill="#C3CEDA"/>
    <path d="M534 232a24 24 0 0 1 48 0z" fill="#C3CEDA"/>
  </g>
  <circle cx="556" cy="152" r="7" fill="#E0453A"/><circle cx="554" cy="150" r="2.4" fill="#FFB0A8"/>

  <!-- Chong ho so -->
  <g filter="url(#h-soft)">
    <g transform="rotate(-7 250 380)">
      <path d="M96 236h108l18 24h150a14 14 0 0 1 14 14v186a14 14 0 0 1-14 14H96a14 14 0 0 1-14-14V250a14 14 0 0 1 14-14z" fill="url(#h-folder-back)"/>
    </g>
    <g transform="rotate(-3 250 386)">
      <path d="M104 252h104l18 24h154a14 14 0 0 1 14 14v182a14 14 0 0 1-14 14H104a14 14 0 0 1-14-14V266a14 14 0 0 1 14-14z" fill="url(#h-folder-mid)"/>
    </g>

    <!-- Giay to lo ra khoi bia -->
    <rect x="132" y="272" width="242" height="150" rx="6" fill="#FFFFFF" transform="rotate(2 253 347)"/>
    <g transform="rotate(2 253 347)" opacity=".5">
      <rect x="152" y="296" width="150" height="8" rx="4" fill="#AFBCC8"/>
      <rect x="152" y="316" width="196" height="8" rx="4" fill="#CBD5DE"/>
      <rect x="152" y="336" width="172" height="8" rx="4" fill="#CBD5DE"/>
    </g>

    <!-- Bia truoc -->
    <g transform="rotate(1 250 400)">
      <path d="M110 288h100l18 24h156a16 16 0 0 1 16 16v148a16 16 0 0 1-16 16H110a16 16 0 0 1-16-16V304a16 16 0 0 1 16-16z" fill="url(#h-folder-front)"/>
      <path d="M94 330h306v6H94z" fill="#FFFFFF" opacity=".16"/>
      <rect x="128" y="356" width="150" height="46" rx="7" fill="#FDF6EC"/>
      <text x="203" y="386" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="1.4" fill="#10243A">HỒ SƠ 01</text>
      <g transform="rotate(-9 330 420)">
        <rect x="252" y="398" width="156" height="42" rx="7" fill="none" stroke="#D9531F" stroke-width="3.4" opacity=".92"/>
        <text x="330" y="426" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="1" fill="#D9531F" opacity=".92">CẦN ĐIỀU TRA</text>
      </g>
    </g>
  </g>

  <!-- O khoa -->
  <g filter="url(#h-soft-sm)" transform="translate(444 318)">
    <path d="M22 44V30a30 30 0 0 1 60 0v14" fill="none" stroke="url(#h-steel)" stroke-width="16" stroke-linecap="round"/>
    <rect x="2" y="42" width="100" height="84" rx="15" fill="url(#h-steel)"/>
    <rect x="2" y="42" width="100" height="84" rx="15" fill="none" stroke="#8CA2B4" stroke-width="2"/>
    <circle cx="52" cy="76" r="11" fill="#2A4B68"/>
    <path d="M48 84h8l2 20h-12z" fill="#2A4B68"/>
  </g>

  <!-- Kinh lup -->
  <g filter="url(#h-soft)" transform="rotate(-18 214 392)">
    <rect x="266" y="442" width="34" height="96" rx="17" fill="url(#h-steel)" stroke="#8CA2B4" stroke-width="2"/>
    <rect x="272" y="428" width="22" height="30" rx="8" fill="#6F8598"/>
    <circle cx="214" cy="392" r="86" fill="url(#h-glass)"/>
    <circle cx="214" cy="392" r="86" fill="none" stroke="url(#h-rim)" stroke-width="13"/>
    <circle cx="214" cy="392" r="93" fill="none" stroke="#1E4256" stroke-width="3" opacity=".45"/>
    <path d="M168 348a62 62 0 0 1 38-22" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity=".72"/>
    <path d="M160 372a58 58 0 0 1 8-16" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
