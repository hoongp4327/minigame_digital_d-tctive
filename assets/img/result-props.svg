    <linearGradient id="r-steel" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#EDF3F7"/><stop offset=".5" stop-color="#C6D4DF"/><stop offset="1" stop-color="#93A6B6"/>
    </linearGradient>
    <radialGradient id="r-glass" cx=".34" cy=".3" r=".78">
