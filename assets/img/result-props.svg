<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="r-folder" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#F79462"/><stop offset=".6" stop-color="#F16A36"/><stop offset="1" stop-color="#DB551F"/>
    </linearGradient>
    <linearGradient id="r-shield" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#3E7FB6"/><stop offset="1" stop-color="#1D4A73"/>
